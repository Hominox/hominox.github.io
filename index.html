function onboard(){R.innerHTML=`<div class="wrap narrow"><h1 style="font-size:2.4rem">Create your profile</h1><p class="mut">About two minutes. In this demo everything stays in your browser.</p><div class="panel"><label class="chk"><input type="checkbox" id="ag" ${ck('hmu_age')?'checked':''}> I’m 18 or older</label><label>Display name<input id="nm" maxlength="20" placeholder="e.g. Lerato"></label><div id="obc"></div><label>Not looking for<input id="dn" placeholder="e.g. pressure, married people"></label><label>Distance: <output id="ro">10</output> km<input type="range" id="rg" min="1" max="50" value="10" oninput="$('#ro').value=this.value"></label><label class="chk"><input type="checkbox" id="bl" checked> Blur my photos until we match</label><label class="chk"><input type="checkbox" id="dc"> Discreet mode: neutral name, quiet notifications</label><label class="chk"><input type="checkbox" id="vf"> Verify with ID and selfie (simulated). Needed for Spark</label><button class="btn" onclick="obGo()">Create profile</button></div></div>`;obr()}
function obGo(){const n=$('#nm').value.trim();if(!$('#ag').checked)return toast('The app is for adults only (18+)');if(!n)return toast('Add a display name');if(!ob.int.length)return toast('Pick at least one intention');
ck('hmu_age','1',365);st.u={n,dn:$('#dn').value,rg:+$('#rg').value,bl:$('#bl').checked,dc:$('#dc').checked,ver:$('#vf').checked,hc:1};st.int[ob.sp]=ob.int;st.sp=ob.sp;st.w++;sv();applyDisc();toast('Profile created: 1 database write');app()}
function disc(){const sp=SP[st.sp],mi=st.int[st.sp]||[];
let h=`<div class="pills">${Object.keys(SP).map(k=>`<button class="pill${k==st.sp?' on':''}" onclick="st.sp='${k}';sv();app()">${ic(SP[k].i,16)}${SP[k].n}</button>`).join('')}</div><div class="panel"><b>Your intention in ${sp.n}</b> <small>Up to 2. Change anytime.</small><div class="chips">${sp.I.map((x,i)=>`<button class="chip${mi.includes(i)?' on':''}" title="${x[1]}" onclick="pick(${i})">${x[0]}</button>`).join('')}</div></div>`;
if(st.sp=='spark'&&!st.u.ver)h+=`<div class="panel"><h3>${ic(LOCK,18)} Spark needs a verified profile</h3><p class="mut">Everyone here is ID-checked, which keeps the Space safer for all. Free for everyone.</p><button class="btn" onclick="st.u.ver=true;st.w++;sv();toast('Verified (simulated)');app()">Verify with ID and selfie</button></div>`;
else if(!mi.length)h+=`<div class="panel"><b>Pick an intention above to see people.</b><p class="mut" style="margin:4px 0 0">You only see people whose intention is compatible with yours.</p></div>`;
else{const L=PR.filter(p=>p.sp==st.sp&&!st.pass.includes(p.id)&&mi.some(m=>sp.I[m][2].includes(p.it)));
h+=`<p class="mut">${L.length} compatible people nearby. Likes left today: ${st.pro?'unlimited':Math.max(0,10-st.lk)}</p><div class="cards">${L.map(p=>{const same=mi.includes(p.it),m=st.mt.includes(p.id),l=st.likes.includes(p.id);return`<div class="card"><div class="ph">${av(p,st.u.bl&&!m)}${p.v?`<span class="vb">${ic(CHK,12)}Verified</span>`:''}</div><div class="cb"><b>${p.n}, ${p.a}</b> <small>${p.km} km</small><div class="intent${same?'':' warn'}">Looking for: <b>${sp.I[p.it][0]}</b>${same?'':'<small>Different from yours. Both profiles show this notice.</small>'}</div><p>${p.b}</p><button class="btn" ${l||m?'disabled':''} onclick="like(${p.id})">${m?'Matched':l?'Liked':'Like'}</button> <button class="ghost" onclick="st.pass.push(${p.id});sv();disc()">Pass</button> <button class="ghost" onclick="rep(${p.id})">Report</button></div></div>`}).join('')||'<p class="mut">No one yet. Try adding a second intention.</p>'}</div>`}
$('#main').innerHTML=h}
function pick(i){const a=st.int[st.sp]=st.int[st.sp]||[],k=a.indexOf(i);if(k>-1)a.splice(k,1);else if(a.length<2)a.push(i);else toast('You can pick up to 2 intentions');st.w++;sv();disc()}
async function like(id){if(!st.pro&&st.lk>=10)return toast('Daily likes used. Upgrade for unlimited.');st.lk++;st.likes.push(id);st.w++;
if(id%3!=2){st.mt.push(id);st.w++;await putC(id,[{f:'th',t:'Hi! Saw we want the same thing. How’s your week going?',ts:Date.now()}]);st.m++;toast('It’s a match with '+P(id).n+'! Photo unblurred.')}else toast('Liked. You’ll be told if it’s mutual.');sv();disc()}
function rep(id){st.rep.push(id);st.pass.push(id);sv();toast('Reported and hidden. Moderators will review it.');disc()}
const RP=['Sounds good to me.','Haha, same here.','I’d like that. Somewhere public?','Tell me more about you.','Great, let’s plan it.'];
async function mt(){const ms=st.mt.map(P);if(!ms.length){$('#main').innerHTML='<div class="panel"><b>No matches yet.</b><p class="mut" style="margin:4px 0 0">Like a few people in Discover. Chats open on a mutual like.</p></div>';return}
if(chat==null||!st.mt.includes(chat))chat=ms[0].id;const p=P(chat),a=await getC(chat),raw=localStorage['hmu_c_'+chat]||'',sp=SP[p.sp];
$('#main').innerHTML=`<div class="chatbox"><div class="ml">${ms.map(x=>`<button class="${x.id==chat?'on':''}" onclick="chat=${x.id};mt()">${av(x)}<span><b>${x.n}</b><br><small>${SP[x.sp].n}</small></span></button>`).join('')}</div><div class="cp"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${p.n}, ${p.a}</b><br><small>Wants: ${sp.I[p.it][0]}</small></div><div><button class="ghost" onclick="meet(${p.id})">Plan meetup</button> <button class="ghost" onclick="rep(${p.id});st.mt=st.mt.filter(x=>x!=${p.id});sv();mt()">Block</button></div></div><div class="msgs" id="ms">${a.map(x=>`<div class="b${x.f=='me'?' me':''}">${x.t}</div>`).join('')}</div><div><div class="send"><input id="mi" placeholder="Write a message" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div><p class="lock" style="margin:10px 0 0">${ic(LOCK,14)} Encrypted on this device. 0 database writes for ${a.length} messages.</p><p style="margin:4px 0 0"><small>Stored as:</small> <code>${raw.slice(0,60)}…</code></p></div></div></div>`;const e=$('#ms');e.scrollTop=e.scrollHeight}
async function send(){const i=$('#mi'),t=i.value.trim(),id=chat;if(!t)return;const a=await getC(id);a.push({f:'me',t,ts:Date.now()});await putC(id,a);st.m++;sv();mt();
setTimeout(async()=>{const b=await getC(id);b.push({f:'th',t:RP[b.length%RP.length],ts:Date.now()});await putC(id,b);st.m++;sv();if(tab=='mt'&&chat==id&&location.hash=='#app')mt()},1300)}
function meet(id){const p=P(id);modal(`<h3>Plan a meetup with ${p.n}</h3><p class="mut">Before you meet, both of you confirm what you’re each looking for.</p><div class="intent">You: <b>${(st.int[p.sp]||[]).map(i=>SP[p.sp].I[i][0]).join(' + ')||'not set'}</b><br>${p.n}: <b>${SP[p.sp].I[p.it][0]}</b></div><div id="mq" style="margin-top:14px"><button class="btn" onclick="meet2(${id})">We’re on the same page</button> <button class="ghost" onclick="modal()">Not yet</button></div>`)}
function meet2(id){const p=P(id);$('#mq').innerHTML='<small>Waiting for '+p.n+' to confirm…</small>';setTimeout(()=>{$('#mq').innerHTML=`<p><b>Both confirmed.</b> Meet in public first. Ideas: a mall café or food court in town.</p><p class="lock">${ic(CHK,14)} Reminder: either of you can change your mind at any time. No means no.</p><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('Meeting ${p.n} today. Sharing from HookMeUp.');toast('Meetup details copied for a trusted friend');modal()">Share with a trusted friend</button>`},1000)}
function set(){const u=st.u,tg=(k,l)=>`<label class="chk"><input type="checkbox" ${u[k]?'checked':''} onchange="st.u.${k}=this.checked;st.w++;sv();applyDisc()"> ${l}</label>`,d=st.bk?new Date(st.bk).toLocaleDateString():'never';
$('#main').innerHTML=`<div class="two"><div><div class="panel"><h3>Privacy</h3>${tg('bl','Blur photos until match')}${tg('dc','Discreet mode (neutral name and quiet notifications)')}${tg('hc','Hide me from my phone contacts')}<label class="chk"><input type="checkbox" ${st.pro?'checked':''} onchange="st.pro=this.checked?1:0;sv();app()"> Premium (demo switch: unlimited likes)</label></div><div class="panel"><h3>Safety</h3><label>Emergency contact<input placeholder="Name and number" onchange="st.w++;sv();toast('Saved')"></label><small>Verified badge: ${u.ver?'yes':'no'}. Block, report and consent reminders are always free. Sexual health: optional testing badge and links to local clinics.</small></div></div>
<div><div class="panel"><h3>Your demo usage</h3><p>Database writes (profile, intentions, likes, matches): <b>${st.w}</b><br>Chat messages kept on device: <b>${st.m}</b><br>Last encrypted backup: <b>${d}</b></p><button class="btn" onclick="st.bk=Date.now();st.w++;sv();toast('Backup of ${st.m} messages = 1 write');set()">Back up chats now</button><p><small>Production plan: one encrypted backup blob to R2 every 14 days. Only you hold the key.</small></p></div><div class="panel"><button class="ghost" onclick="if(confirm('Erase all demo data?')){localStorage.clear();['hmu_age','hmu_adm'].forEach(k=>ck(k,'',0));location.hash='#home';location.reload()}">Reset demo</button></div></div></div>`}
/* ---- ADMIN ---- */
const rnd=s=>{const x=Math.sin(s)*1e4;return x-Math.floor(x)};
let Q;try{Q=JSON.parse(localStorage.hmu_q)}catch(e){}
Q=Q||{r:[['Pressure for photos','Thato, 27','Spark'],['Lied about relationship status','Pule, 34','Spark'],['Asked for money','Limpho, 29','Love'],['Spam links in chat','Neo, 22','Friends'],['Harassing language','Tsepo, 31','Friends']],v:[['Katleho, 26','ID + selfie'],['Palesa, 30','ID + selfie'],['Mpho, 41','ID + selfie'],['Lineo, 24','ID + selfie']],u:[['Lerato',24,'Love','active'],['Thabo',31,'Spark','active'],['Refiloe',28,'Grow','active'],['Boitumelo',35,'Support','active'],['Rethabile',22,'Friends','active'],['Naledi',27,'Love','active'],['Tumelo',33,'Spark','suspended'],['Karabo',29,'Friends','active']]};
const sq=()=>{try{localStorage.hmu_q=JSON.stringify(Q)}catch(e){}};
function admin(){ck('hmu_adm')=='1'?dash():login()}
function login(e){R.innerHTML=`<div class="wrap narrow"><h1 style="font-size:2.4rem">Admin sign in</h1><div class="panel"><label>Email<input id="ae" value="" autocomplete="off"></label><label>Password<input id="ap" type="password"></label><p id="ar" style="color:var(--red);margin:0 0 10px;min-height:1.2em">${e||''}</p><button class="btn" onclick="doLogin()">Sign in</button></div><div class="panel"><b>Demo credentials</b><br><small>admin@hookmeup.ls / hookme2026. In production this would be Cloudflare Access or a hashed password with MFA.</small></div></div>`}
function doLogin(){if($('#ae').value.trim()=='admin@hookmeup.ls'&&$('#ap').value=='hookme2026'){ck('hmu_adm','1',1);dash()}else login('Wrong email or password.')}
function bars(a,h=130){const m=Math.max(...a),w=100/a.length;return`<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">${a.map((v,i)=>`<rect x="${i*w+w*.12}" y="${h-v/m*(h-6)}" width="${w*.76}" height="${v/m*(h-6)}" fill="${i==a.length-1?'#e11d2e':'#26272b'}" rx="1"/>`).join('')}</svg>`}
function dash(){const sg=Array.from({length:14},(_,i)=>Math.round(60+rnd(i+1)*50+i*6));let dau=1284,wr=6240,msgs=18420;
const mix=[['Love',34],['Friends',25],['Spark',22],['Grow',11],['Support',8]];
R.innerHTML=`<div class="wrap" style="padding-top:28px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1 style="font-size:2.2rem;margin:0">Platform overview</h1><button class="ghost" onclick="ck('hmu_adm','',0);admin()">Sign out</button></div><p class="mut">Sample metrics for Maseru, plus your own demo session. Updates live.</p>
<div class="kpis"><div class="kpi"><small>Active today</small><b id="k1">${dau}</b></div><div class="kpi"><small>New signups</small><b>${sg[13]+(st.u?1:0)}</b></div><div class="kpi"><small>Matches today</small><b>${311+st.mt.length}</b></div><div class="kpi"><small>Verified users</small><b>71%</b></div><div class="kpi"><small>Open reports</small><b id="k5">${Q.r.length+st.rep.length}</b></div></div>
<div class="two" style="margin-top:14px"><div class="panel"><b>Signups, last 14 days</b>${bars(sg)}</div><div class="panel"><b>Users by Space</b>${mix.map(m=>`<div style="margin-top:8px"><small>${m[0]} ${m[1]}%</small><div class="meter"><i style="width:${m[1]*2.4}%"></i></div></div>`).join('')}</div></div>
<div class="two"><div class="panel"><b>Cloudflare budget (assumed free tier)</b><div style="margin-top:10px"><small>D1 writes today: <span id="wr">${wr}</span> of 100,000 (check current limits)</small><div class="meter"><i id="wm" style="width:${wr/1000}%"></i></div><small>If chats were stored in D1: ${msgs.toLocaleString()} more writes</small><div class="meter g"><i style="width:${Math.min(100,(wr+msgs)/1000)}%"></i></div><small>Messages stay on devices, so they use none of the write quota.</small></div><p style="margin:12px 0 0"><small>R2 storage: 3.1 GB of 10 GB (profile photos only)</small></p><div class="meter"><i style="width:31%"></i></div></div>
<div class="panel"><b>Live activity</b><div class="feed" id="fd"></div></div></div>
<div class="two"><div class="panel"><b>Reports</b><div class="ov-x"><table id="qr"></table></div></div><div class="panel"><b>Verification queue</b><div class="ov-x"><table id="qv"></table></div></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>Users</b><input id="us" placeholder="Search name" oninput="tu()" style="padding:6px 10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit"></div><div class="ov-x"><table id="tb"></table></div></div>
<div class="panel"><b>This browser (your demo user)</b><p class="mut" style="margin:6px 0 0">${st.u?`${st.u.n}: ${st.w} DB writes, ${st.likes.length} likes, ${st.mt.length} matches, ${st.m} local messages, ${st.rep.length} reports filed`:'No demo profile yet. Create one in the app and return.'}</p></div></div>`;
tq();tu();const EV=['New signup in Love','Match made in Friends','Photo uploaded to R2','Report filed in Spark','Verification submitted','Intention changed in Grow','Backup completed'];
const ev=()=>{const f=$('#fd');if(!f)return;const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+'  '+EV[Math.floor(Math.random()*EV.length)];f.prepend(d)};for(let i=0;i<5;i++)ev();
TM.push(setInterval(()=>{if(!$('#k1'))return;dau+=Math.floor(Math.random()*4);wr+=Math.floor(Math.random()*9);$('#k1').textContent=dau;$('#wr').textContent=wr;$('#wm').style.width=wr/1000+'%';ev()},2500))}
function tq(){$('#qr').innerHTML='<tr><th>Issue</th><th>User</th><th></th></tr>'+Q.r.map((r,i)=>`<tr><td>${r[0]}<br><span class="tag">${r[2]}</span></td><td>${r[1]}</td><td><button class="ghost" onclick="ra(${i},'Warned')">Warn</button> <button class="btn" onclick="ra(${i},'Suspended')">Suspend</button> <button class="ghost" onclick="ra(${i},'Dismissed')">Dismiss</button></td></tr>`).join('')+st.rep.map(id=>`<tr><td>Reported from demo<br><span class="tag r">New</span></td><td>${P(id).n}, ${P(id).a}</td><td><button class="ghost" onclick="st.rep=st.rep.filter(x=>x!=${id});sv();toast('Dismissed');dash()">Dismiss</button></td></tr>`).join('');
$('#qv').innerHTML='<tr><th>User</th><th>Docs</th><th></th></tr>'+(Q.v.map((v,i)=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td><button class="btn" onclick="Q.v.splice(${i},1);sq();toast('Verified');tq()">Approve</button> <button class="ghost" onclick="Q.v.splice(${i},1);sq();toast('Rejected');tq()">Reject</button></td></tr>`).join('')||'<tr><td colspan="3" class="mut">Queue is empty.</td></tr>')}
function ra(i,a){const r=Q.r.splice(i,1)[0];if(a=='Suspended'){const u=Q.u.find(x=>r[1].startsWith(x[0]));if(u)u[3]='suspended'}sq();toast(a+': '+r[1]);$('#k5').textContent=Q.r.length+st.rep.length;tq();tu()}
function tu(){const s=($('#us').value||'').toLowerCase();$('#tb').innerHTML='<tr><th>Name</th><th>Age</th><th>Space</th><th>Status</th><th></th></tr>'+Q.u.map((u,i)=>[u,i]).filter(x=>x[0][0].toLowerCase().includes(s)).map(([u,i])=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td>${u[2]}</td><td><span class="tag${u[3]=='suspended'?' r':''}">${u[3]}</span></td><td><button class="ghost" onclick="Q.u[${i}][3]=Q.u[${i}][3]=='active'?'suspended':'active';sq();tu()">${u[3]=='active'?'Suspend':'Restore'}</button></td></tr>`).join('')}
applyDisc();route();
</script>
</body>
</html>
